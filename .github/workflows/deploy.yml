name: Deploy XEYGATE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile 2>/dev/null || pnpm install
          pnpm build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            # Install Node.js 22 if missing
            if ! command -v node &>/dev/null || [[ "$(node -v | cut -d. -f1 | tr -d 'v')" -lt 22 ]]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs
            fi

            # Install pnpm
            command -v pnpm &>/dev/null || npm install -g pnpm@latest

            # Clone or pull
            APP_DIR=/opt/xeygate
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone --branch main --depth 1 https://github.com/qwetls/xeygate.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Build
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install
            pnpm build

            # Setup systemd
            mkdir -p "$APP_DIR/data"
            cat > /etc/systemd/system/xeygate.service << 'EOF'
            [Unit]
            Description=XEYGATE AI Gateway
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/xeygate
            ExecStart=/usr/bin/node apps/api/dist/index.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=4000
            Environment=DATABASE_PATH=/opt/xeygate/data/xeygate.db

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable xeygate
            systemctl restart xeygate
            echo "✅ XEYGATE deployed on port 4000"

      - name: Health check
        run: |
          sleep 5
          curl -sf http://${{ secrets.VPS_HOST }}:4000/health || echo "⚠️ Health check pending — server may still start"
