name: Build & Publish Docker to GHCR

on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

jobs:
    check-version:
        name: Check Release Version
        runs-on: ubuntu-latest
        outputs:
            should_build: ${{ steps.check.outputs.should_build }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Evaluate version
              id: check
              run: |
                VERSION=$(node -p "require('./package.json').version")
                echo "Current package version: $VERSION"
                if [[ "$VERSION" =~ -rc[0-9]*$ ]] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
                  echo "Detected release candidate version ($VERSION). Skipping GHCR build on main push."
                  echo "should_build=false" >> $GITHUB_OUTPUT
                else
                  echo "should_build=true" >> $GITHUB_OUTPUT
                fi

    build-and-push:
        name: Build & Push Docker Image
        needs: check-version
        if: needs.check-version.outputs.should_build == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Downcase repository name for Docker registry
              run: |
                  echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Set up QEMU (Multi-platform support)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=ref,event=branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64
